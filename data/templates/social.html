<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{TITLE}}</title>
<style>
/*@base*/
/* Social setup wizard. Three zones on wide screens: step list, the current step, and a live preview of the
   profiles taking shape. Narrow screens stack them: step list folds away, preview follows the step. The
   preview mocks are light like the real platforms but carry no platform logos. */
body{padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,11,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brandline{font:600 11px/1.2 var(--body);letter-spacing:.24em;color:var(--amber);text-transform:uppercase}
.live{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#46536b;display:inline-block;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--teal);box-shadow:0 0 0 4px rgba(25,195,174,.18)}
.pillbtn{font:600 13px var(--body);border-radius:999px;padding:6px 12px;border:1px solid var(--line);background:var(--raise);color:var(--ink);cursor:pointer}
.pillbtn.amber{border-color:var(--amber);color:var(--amber);background:transparent}
.switch{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}
.switch input{accent-color:var(--teal);width:16px;height:16px;flex-shrink:0}
.app{max-width:1400px;margin:20px auto 0;display:grid;grid-template-columns:240px minmax(0,1fr) 380px;gap:24px;align-items:start}
.rail{position:sticky;top:76px;display:grid;gap:14px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.railbox>summary{display:none}
#rail{display:grid;gap:14px}
#bannerhost:empty{display:none}
.group b{display:block;font:600 11px/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 10px}
.group ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ritem{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:7px 10px;color:#c9d4e6;font:500 14px/1.3 var(--body);cursor:pointer}
.ritem:hover{background:var(--surface)}
.ritem.cur{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--amber)}
.ritem .st{width:20px;height:20px;border-radius:50%;border:2px solid #3a4862;display:grid;place-items:center;font:800 11px var(--display);color:#04201c}
.ritem.done .st{background:var(--teal);border-color:var(--teal)}
.ritem.cur:not(.done) .st{border-color:var(--amber)}
.peerpin{font:700 10px/1 var(--body);background:var(--amber);color:var(--on-amber);border-radius:999px;padding:3px 6px}
.stage{display:grid;gap:16px;min-width:0}
.talk{border:1px dashed rgba(242,169,59,.55);background:rgba(242,169,59,.06);border-radius:14px;padding:14px 16px;display:grid;gap:8px;font-size:14px}
.talk .lab{font:600 11px/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.talk q{font-size:15px;color:var(--ink);quotes:'“' '”'}
.talk ul{margin:0;padding-left:18px;color:#c9d4e6;display:grid;gap:3px}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:16px;min-width:0}
.screen:focus{outline:none}
.kicker{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.kicker span+span{color:var(--muted)}
.screen h1{font-size:clamp(26px,3.4vw,38px);margin:0}
.why{color:#c9d4e6;font-size:16px;max-width:62ch}
.do{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.do h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-family:var(--body);font-weight:600}
.do ol{margin:0;padding-left:20px;display:grid;gap:6px;color:#dbe4f2}
.src{display:inline-block;margin-top:10px;font-size:14px}
.kit{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--raise);display:grid;gap:8px;min-width:0}
.card .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.card .lb{font:700 15px/1.3 var(--display)}
.card ul{margin:0;padding-left:18px;display:grid;gap:4px}
.chip{font:600 12px/1 var(--body);border-radius:999px;padding:5px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{border-color:rgba(25,195,174,.6);color:var(--teal)}
.chip.wait{border-color:rgba(242,169,59,.6);color:var(--amber);background:none;cursor:pointer}
.txt{white-space:pre-wrap;font-size:15px;color:var(--ink);background:var(--bg);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:600 14px var(--body);border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--raise);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.facts{display:grid;gap:6px;margin:0}
.facts div{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15px;min-width:0}
.opt>span{flex:1;min-width:0;overflow-wrap:anywhere}
.opt input{accent-color:var(--amber);width:18px;height:18px;flex-shrink:0}
.opt.sel{border-color:var(--amber)}
.opt small{display:block;color:var(--muted);font-size:13px}
input.in,textarea.in{font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea.in{min-height:84px;resize:vertical}
input.in:focus-visible,textarea.in:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.err{color:var(--amber);font-size:13px;min-height:1em}
.asset{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px;align-items:center}
.asset img{width:100%;max-width:100%;border-radius:8px;border:1px solid var(--line);background:#000;display:block}
.asset .meta{display:grid;gap:6px;font-size:14px;color:#c9d4e6;justify-items:start}
.tip{border-left:3px solid var(--teal);padding:8px 12px;color:#c9d4e6;font-size:14px;background:rgba(25,195,174,.06);border-radius:0 8px 8px 0}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line)}
.nav .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.donebadge{color:var(--teal);font-weight:600;font-size:14px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.cards3 div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:#c9d4e6}
.cards3 b{display:block;color:var(--ink);font:700 15px var(--display);margin-bottom:4px}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.lists div{font-size:14px;color:#c9d4e6}
.lists b{display:block;color:var(--ink);font:700 15px var(--display);margin-bottom:4px}
.lists ul{margin:0;padding-left:18px;display:grid;gap:3px}
.approve{border:1px solid rgba(242,169,59,.55);border-radius:12px;padding:16px;display:grid;gap:10px;background:rgba(242,169,59,.05)}
.approve.ok{border-color:rgba(25,195,174,.6);background:rgba(25,195,174,.06)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.ocard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;justify-items:start}
.ocard.on{border-color:var(--amber)}
.ocard b{font:700 16px var(--display)}
.ocard p{font-size:14px;color:#c9d4e6}
.ocard .ac{font-size:13px;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:rgba(242,169,59,.1);border:1px solid rgba(242,169,59,.5);border-radius:12px;padding:10px 14px;font-size:14px}
.preview{position:sticky;top:76px;display:grid;gap:12px;max-height:calc(100vh - 96px);overflow:auto}
.meter{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.meter svg{width:72px;height:72px}
.meter b{display:block;font:800 22px var(--display)}
.meter span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 13px var(--body);border-radius:999px;padding:7px 12px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mock{--m-bg:#f0f2f5;--m-card:#fff;--m-ink:#1c1e21;--m-mut:#65676b;--m-line:#dadde1;--m-acc:#075cf3;background:var(--m-bg);color:var(--m-ink);border-radius:14px;overflow:hidden;font:14px/1.45 var(--body);transition:box-shadow .3s}
.mock.pulse{box-shadow:0 0 0 3px var(--amber)}
.mock .cover{aspect-ratio:1640/624;background:#e4e6eb;display:grid;place-items:center;color:var(--m-mut);font-size:13px;border-bottom:1px solid var(--m-line);overflow:hidden}
.mock .cover img{width:100%;height:100%;object-fit:cover;display:block}
.mock .body{background:var(--m-card);padding:0 16px 16px;display:grid;gap:8px}
.mock .av{width:84px;height:84px;border-radius:50%;border:4px solid var(--m-card);background:#e4e6eb;margin-top:-42px;overflow:hidden;display:grid;place-items:center;color:var(--m-mut);font-size:11px;text-align:center;line-height:1.2}
.mock .av img{width:100%;height:100%;object-fit:cover}
.mock .av.sq{border-radius:12px;margin-top:0}
.mock h3{margin:0;font:800 20px/1.2 var(--display);color:var(--m-ink);overflow-wrap:anywhere}
.mock .sub{color:var(--m-mut);font-size:13px;overflow-wrap:anywhere}
.mock .ph{color:#8a8d91;font-style:italic;font-weight:400}
.mock .pill{display:inline-block;font:600 12px/1 var(--body);border-radius:6px;padding:7px 10px;background:var(--m-acc);color:#fff}
.mock .tag{display:inline-block;font:600 11px/1 var(--body);border-radius:999px;padding:4px 8px;background:#e7f3ff;color:#0b4fa8;margin:0 6px 4px 0}
.mock .tag.g{background:#e6f6ee;color:#11653a}
.mock .dl{display:grid;gap:4px;font-size:13px;border-top:1px solid var(--m-line);padding-top:8px}
.mock .dl span{color:var(--m-mut)}
.mock .igtop{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;padding:16px 16px 0;background:var(--m-card)}
.mock .igtop .av{margin:0}
.mock .bio{white-space:pre-wrap}
.mock .gtop{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:16px;background:var(--m-card)}
.mock .gtop .av{width:64px;height:64px;margin:0}
.mock .empty{padding:24px 16px;background:var(--m-card);color:var(--m-mut)}
.mocknote{font-size:12px;color:var(--muted)}
.notes{display:grid;gap:6px}
.notes label{font:600 11px/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 14px var(--body);border-radius:999px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.peek{display:none}
@media (max-width:1180px){.peek{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;font:700 13px var(--body);border-radius:999px;padding:10px 14px;border:1px solid var(--teal);background:var(--bg);color:var(--teal);box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer}.peek[hidden]{display:none}.toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}}
@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr);max-width:820px}
  .rail,.preview{position:static;max-height:none;overflow:visible}
  .railbox>summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;list-style:none}
  .railbox>summary::-webkit-details-marker{display:none}
  .railbox[open]>summary{margin-bottom:10px}
}
@media (max-width:520px){
  .screen{padding:18px}
  .asset{grid-template-columns:minmax(0,1fr)}
  .asset img{max-width:220px}
  .facts div{grid-template-columns:minmax(0,1fr) auto}
  .facts dt{grid-column:1/-1;margin-bottom:-6px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){.toast,.mock{transition:none}}
</style>
</head>
<body class="role-{{ROLE}}">
<header class="top"><div class="in"><div class="brandline" id="brandline"></div><div class="live" id="live" aria-live="polite"></div></div></header>
<div class="app">
  <nav class="rail" aria-label="Setup steps"><details class="railbox" id="railbox"><summary id="railsum"></summary><div id="rail"></div></details></nav>
  <main class="stage" id="stage"><div id="bannerhost"></div><div id="stagebody" class="stage"></div></main>
  <aside class="preview" id="preview" aria-label="Live preview"></aside>
</div>
<button class="peek" id="peek" type="button"></button>
<div class="toast" id="toast" role="status"></div>
<script id="cfg" type="application/json">{{CONFIG}}</script>
<script>
(function () {
  'use strict';
  const CFG = JSON.parse(document.getElementById('cfg').textContent);
  const OP = CFG.role === 'operator';
  const PEER = OP ? CFG.clientFirst : CFG.operatorFirst;
  const KIT = CFG.kit;
  const $ = (id) => document.getElementById(id);
  const STEP = {}, CHAN = {};
  CFG.channels.forEach((ch) => ch.steps.forEach((s) => { STEP[s.id] = s; CHAN[s.id] = ch; }));
  const FIXED = { start: 'Welcome', review: 'Review your copy', more: 'More channels', finish: 'All set' };
  const OWNERS = [
    ['me', 'I do', 'I set it up, or I can log in to it.'],
    ['carrier', 'My carrier does', 'Corporate manages it for me.'],
    ['none', 'There isn’t one yet', 'Nothing shows on Google Maps.'],
    ['unsure', 'Not sure', 'We check together after the call.'],
  ];
  const FIELD_LABEL = { pageName: 'the Page name', igUsername: 'the Instagram username', hours: 'the office hours' };
  const WIDE = window.matchMedia('(min-width:1181px)');

  // ---------- state ----------
  const blank = () => ({ v: 2, rev: 0, done: [], googleOwner: '', fields: { pageName: '', igUsername: '', hours: '' }, links: {}, wants: [], other: '', approval: null, lead: null });
  let S = blank(), peer = null, opData = { notes: '', ours: [] };
  let mode = 'pending', saveNote = '', pending = 0, timer = 0;
  let current = 'start', lastNav = 0, lastActivity = Date.now(), lastLeadSeen = null;
  let following = true, leadMode = OP, tab = null, stageDirty = false, banner = null;

  function normalize(d) {
    const s = blank();
    if (!d || typeof d !== 'object') return s;
    Object.assign(s, d);
    s.fields = Object.assign(blank().fields, d.fields || {});
    s.links = Object.assign({}, d.links || {}); s.done = (d.done || []).slice(); s.wants = (d.wants || []).slice();
    return s;
  }
  const googleApplies = (o) => o === 'me' || o === 'none';
  function applies(id) {
    if (!CFG.screens.includes(id)) return false;
    const s = STEP[id];
    if (s && CHAN[id].id === 'google' && s.kind !== 'question') return googleApplies(S.googleOwner);
    return true;
  }
  const screens = () => CFG.screens.filter(applies);
  const stepScreens = () => screens().filter((id) => STEP[id]);
  const isDone = (id) => {
    if (id === 'review') return !!S.approval;
    if (id === 'more') return S.wants.length > 0 || !!S.other;
    const s = STEP[id]; if (!s) return false;
    return s.kind === 'question' ? S.googleOwner !== '' : S.done.includes(id);
  };
  const titleOf = (id) => FIXED[id] || (STEP[id] && STEP[id].title) || id;
  function progress() { const ids = stepScreens(); const d = ids.filter(isDone).length; return { done: d, total: ids.length, pct: ids.length ? Math.round(d / ids.length * 100) : 0 }; }
  const ago = (iso) => { const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000)); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago'; };
  const peerActive = () => !!peer && Date.now() - Date.parse(peer.at) < 45000;

  // ---------- tiny DOM helper: text always goes in as text ----------
  function el(tag, attrs) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    }
    const kids = Array.prototype.slice.call(arguments, 2).flat(2);
    for (const k of kids) if (k != null && k !== false && k !== '') n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  }

  // ---------- network ----------
  function readLocal() { try { const v = localStorage.getItem(CFG.storageKey); return v ? normalize(JSON.parse(v)) : null; } catch (e) { return null; } }
  function writeLocal() { try { localStorage.setItem(CFG.storageKey, JSON.stringify(S)); } catch (e) {} }

  function adopt(d, source) {
    if (!d) return;
    if (d.operator) opData = d.operator;
    if (!d.progress) return;
    if (d.peer !== undefined) peer = d.peer;
    const next = normalize(d.progress);
    if (next.rev < S.rev) return;
    const prev = S; S = next;
    if (source === 'poll' && next.rev > prev.rev) announce(prev, next);
  }

  function applyLocal(op) {
    const t = (list, id, on) => (on ? (list.includes(id) ? list : list.concat(id)) : list.filter((x) => x !== id));
    if (op.op === 'tick') S.done = t(S.done, op.step, op.value);
    else if (op.op === 'owner') S.googleOwner = op.value;
    else if (op.op === 'field') S.fields[op.field] = op.value;
    else if (op.op === 'link') { if (op.value) S.links[op.channel] = op.value; else delete S.links[op.channel]; }
    else if (op.op === 'want') S.wants = t(S.wants, op.channel, op.value);
    else if (op.op === 'other') S.other = op.value;
    else if (op.op === 'approve') S.approval = op.value ? { by: op.by, at: new Date().toISOString() } : null;
    else if (op.op === 'ours') opData.ours = t(opData.ours, op.step, op.value);
    else if (op.op === 'notes') opData.notes = op.value;
  }

  async function send(op, quiet) {
    if (op.op !== 'here' && op.op !== 'lead') { applyLocal(op); lastActivity = Date.now(); }
    if (mode === 'local') { if (op.op !== 'here' && op.op !== 'lead') writeLocal(); if (!quiet) render(); return; }
    if (mode !== 'shared') return;
    pending++;
    if (!quiet) render();
    try {
      const r = await fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(op), cache: 'no-store' });
      if (r.ok) { adopt(await r.json(), 'post'); saveNote = ''; }
      else saveNote = r.status === 400 ? 'That change wasn’t accepted. Check the value and try again.' : 'Couldn’t save just now. Try again in a moment.';
    } catch (e) { saveNote = 'Couldn’t save just now. Check your connection.'; }
    pending--;
    if (pending === 0) { if (quiet && !saveNote) { renderLive(); renderRail(); } else render(); }
  }

  async function load() {
    try {
      const r = await fetch(CFG.api + (OP ? '?full=1' : ''), { cache: 'no-store' });
      if (!r.ok) throw new Error('status ' + r.status);
      adopt(await r.json(), 'load'); mode = 'shared';
    } catch (e) { mode = 'local'; S = readLocal() || blank(); }
    const hash = decodeURIComponent(location.hash.slice(1));
    let start = applies(hash) ? hash : 'start';
    if (!OP && S.lead && Date.now() - Date.parse(S.lead.at) < 600000 && applies(S.lead.step)) start = S.lead.step;
    lastLeadSeen = S.lead ? S.lead.at : null;
    go(start, { noLead: true, first: true });
    schedule();
    // Presence heartbeat. Every Blob read and write is billed (cheaply on Pro), and it stops while the page sleeps.
    setInterval(() => { if (document.visibilityState === 'visible' && mode === 'shared' && !sleeping) send({ op: 'here', step: current, following }, true); }, 15000);
  }

      ...header('Wrap up', p.done === p.total ? 'Your profiles are set up.' : 'Nice work. A few steps are still open.', p.done + ' of ' + p.total + ' steps are done. Everything is saved, and ' + (OP ? CFG.clientFirst : CFG.operatorFirst) + ' sees it too.'),
      open.length ? el('div', { class: 'card' }, el('span', { class: 'lb' }, 'Still to do'), el('div', { class: 'row' }, open.map((id) => el('button', { class: 'btn sm', type: 'button', onclick: () => go(id) }, titleOf(id))))) : '',
      links.length ? el('div', { class: 'card' }, el('span', { class: 'lb' }, 'Your profile links'), el('ul', null, links)) : '',
      el('div', { class: 'lists' }, el('div', null, el('b', null, 'What happens next'), el('ul', null, el('li', null, 'We confirm our access to your Page, Instagram and Google listing.'), el('li', null, 'We prepare your launch posts for your approval.'), el('li', null, 'Your profile links go on your website once it is approved and live.')))),
      navBar({ primary: CFG.back ? el('a', { class: 'btn pri', href: CFG.back }, 'Back to your welcome page') : el('span') }),
    ];
  }

  function renderBanner() {
    const host = $('bannerhost'); host.replaceChildren();
    if (banner && banner !== current) host.append(el('div', { class: 'banner', role: 'status' }, el('span', null, CFG.operatorFirst + ' is on “' + titleOf(banner) + '”'), el('span', { class: 'row' }, el('button', { class: 'btn sm pri', type: 'button', onclick: () => go(banner, { noLead: true }) }, 'Go there'), el('button', { class: 'btn sm ghost', type: 'button', onclick: () => { banner = null; renderBanner(); } }, 'Stay here'))));
  }
  function renderStage() {
    const st = $('stagebody'); st.replaceChildren();
    const tp = talkPanel(); if (tp) st.append(tp);
    let body;
    if (current === 'start') body = screenStart();
    else if (current === 'review') body = screenReview();
    else if (current === 'more') body = screenMore();
    else if (current === 'finish') body = screenFinish();
    else body = screenStep(STEP[current]);
    const art = el('article', { class: 'screen', tabindex: '-1' }, body);
    const h = art.querySelector('h1'); if (h) { h.id = 'h-' + current; art.setAttribute('aria-labelledby', h.id); }
    st.append(art);
    restoreDrafts();
  }

  // ---------- live preview ----------
  const has = (id) => S.done.includes(id);
  const ph = (t) => el('span', { class: 'ph' }, t);
  const img = (src, alt) => el('img', { src, alt });
  const pageName = () => S.fields.pageName || (has('fb-page') && KIT ? KIT.pageNames[0] : '');
  function avatar(ready, sq) {
    const a = el('div', { class: 'av' + (sq ? ' sq' : '') });
    if (ready && KIT) a.append(img(KIT.assets.mark.url, 'Profile picture')); else a.append('Profile picture');
    return a;
  }
  function details() {
    const dl = el('div', { class: 'dl' });
    if (KIT) KIT.facts.slice(0, 2).forEach(([k, v]) => dl.append(el('div', null, el('span', null, k + ': '), v)));
    dl.append(el('div', null, el('span', null, 'Hours: '), S.fields.hours || ph('add on the call')));
    return dl;
  }
  function tags(list) { const t = el('div'); list.filter(Boolean).forEach(([c, s]) => t.append(el('span', { class: 'tag' + c }, s))); return t.childNodes.length ? t : ''; }
  function mockFacebook() {
    const m = el('div', { class: 'mock' });
    m.append(el('div', { class: 'cover' }, has('fb-photos') && KIT ? img(KIT.assets.cover.url, 'Cover photo') : 'Cover photo'));
    const b = el('div', { class: 'body' }, avatar(has('fb-photos')), el('h3', null, pageName() || ph('Your Page name')), el('div', { class: 'sub' }, has('fb-page') && KIT ? KIT.category : ph('Category')),
      tags([has('fb-2fa') && [' g', 'Login protected'], has('fb-portfolio') && ['', 'In your business portfolio'], has('mp-access') && [' g', 'Genesis has partner access']]),
      el('div', { class: 'bio' }, has('fb-details') && KIT ? KIT.fbBio : ph('Your bio appears here')));
    if (has('fb-details')) b.append(el('div', null, el('span', { class: 'pill' }, 'Call now')), details());
    if (S.links.facebook) b.append(el('div', { class: 'sub' }, S.links.facebook));
    m.append(b);
    return m;
  }
  function mockInstagram() {
    const m = el('div', { class: 'mock' });
    m.append(el('div', { class: 'igtop' }, avatar(has('ig-profile')), el('div', null, el('h3', null, S.fields.igUsername ? '@' + S.fields.igUsername : ph('@username')), el('div', { class: 'sub' }, has('ig-pro') ? 'Professional account' : ph('Personal account')))));
    m.append(el('div', { class: 'body', style: 'padding-top:12px' }, el('b', null, has('ig-profile') && KIT ? KIT.igName : ph('Name')), el('div', { class: 'bio' }, has('ig-profile') && KIT ? KIT.igBio : ph('Your bio appears here')),
      tags([has('ig-link') && ['', 'Linked to your Facebook Page'], has('mp-access') && [' g', 'Genesis has partner access']]), S.links.instagram ? el('div', { class: 'sub' }, S.links.instagram) : ''));
    return m;
  }
  function mockGoogle() {
    const m = el('div', { class: 'mock' });
    const o = S.googleOwner;
    if (!googleApplies(o)) {
      m.append(el('div', { class: 'empty' }, o === 'carrier' ? 'Your carrier manages this listing. We link to it from your website.' : o === 'unsure' ? 'We check who manages your listing after the call.' : 'Answer the Google question to see this preview.'));
      return m;
    }
    m.append(el('div', { class: 'gtop' }, avatar(has('g-photos'), true), el('div', null, el('h3', null, pageName() || ph('Business name')), el('div', { class: 'sub' }, 'Insurance agency'))));
    const b = el('div', { class: 'body', style: 'padding-top:4px' }, tags([has('g-claim') && [' g', 'Verification started'], has('g-manager') && ['', 'Genesis is a manager']]),
      el('div', { class: 'bio' }, has('g-match') && KIT ? KIT.gDescription : ph('Your description appears here')));
    if (has('g-match')) b.append(details());
    m.append(b);
    return m;
  }
  function renderPreview() {
    const pv = $('preview'); pv.replaceChildren();
    const p = progress();
    const c = 2 * Math.PI * 30;
    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    ring.setAttribute('viewBox', '0 0 72 72'); ring.setAttribute('aria-hidden', 'true');
    ring.innerHTML = '<circle cx="36" cy="36" r="30" fill="none" stroke="#101c33" stroke-width="8"/><circle cx="36" cy="36" r="30" fill="none" stroke="#19c3ae" stroke-width="8" stroke-linecap="round" transform="rotate(-90 36 36)" stroke-dasharray="' + (c * p.pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '"/>';
    pv.append(el('div', { class: 'meter' }, ring, el('div', null, el('span', null, (OP ? CFG.clientFirst + '’s' : 'Your') + ' online presence'), el('b', null, p.pct + '% complete'), el('span', null, p.done + ' of ' + p.total + ' steps done'))));
    const tabs = CFG.channels.filter((c) => c.id === 'facebook' || c.id === 'instagram' || c.id === 'google');
    if (!tab || !tabs.some((t) => t.id === tab)) tab = tabs.length ? tabs[0].id : null;
    if (tab) {
      pv.append(el('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Preview' }, tabs.map((t) => el('button', { class: 'tab', type: 'button', role: 'tab', 'aria-selected': String(t.id === tab), onclick: () => { tab = t.id; renderPreview(); } }, t.id === 'facebook' ? 'Facebook Page' : t.id === 'instagram' ? 'Instagram' : 'Google listing'))));
      pv.append(tab === 'facebook' ? mockFacebook() : tab === 'instagram' ? mockInstagram() : mockGoogle());
      pv.append(el('p', { class: 'mocknote' }, 'Preview, not your live page. It fills in as each step is done' + (KIT ? '. The profile picture shows your brand mark until your portrait arrives.' : '.')));
    }
    if (OP) {
      const ta = el('textarea', { class: 'in', id: 'notes', maxlength: 4000, placeholder: 'Call notes, follow-ups, anything to remember' });
      ta.value = opData.notes || '';
      ta.addEventListener('change', () => send({ op: 'notes', value: ta.value }, true));
      pv.append(el('section', { class: 'notes' }, el('label', { for: 'notes' }, 'Call notes · only Genesis sees these'), ta));
    }
  }

  window.addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== current && applies(id)) go(id); });
  WIDE.addEventListener('change', () => { $('railbox').open = WIDE.matches; renderRail(); });
  // Phones: the preview sits below the step, so a floating button jumps to it.
  $('peek').addEventListener('click', () => $('preview').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => { $('peek').hidden = es[0].isIntersecting; }).observe($('preview'));
  renderLive(); renderRail(); renderPreview();
  load();
})();
</script>
</body>
</html>
