<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
/* Genovus Facebook cover, 1640x624 (2x the 820x312 desktop display). Phones show about the centre 1120px,
   so the lockup, tagline and brand line all sit inside x 260-1380. Lockup and brand line are cropped from
   the Genovus logo file itself; only the tagline is set in type. */
*{box-sizing:border-box;margin:0}
html,body{width:1640px;height:624px;overflow:hidden;background:#0b0c10}
.c{position:relative;width:1640px;height:624px;background:radial-gradient(60% 120% at 50% 40%,#13151b 0%,#0b0c10 70%);overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.28}
.g1{width:520px;height:520px;left:-220px;top:220px;background:radial-gradient(circle,#ff5a20 0%,transparent 70%)}
.g2{width:460px;height:460px;right:-200px;top:-200px;background:radial-gradient(circle,#ff9a2a 0%,transparent 70%)}
.stack{position:absolute;left:260px;width:1120px;top:0;height:624px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lockup{width:1000px;height:auto;display:block;mix-blend-mode:lighten}
.tag{margin-top:34px;font:500 31px/1.3 Inter,Arial,sans-serif;color:#c7cad1;letter-spacing:-.2px}
.tag b{color:#ff7a32;font-weight:500}
.brand{margin-top:42px;width:700px;height:auto;display:block;mix-blend-mode:lighten}
</style></head>
<body><div class="c">
<div class="glow g1"></div><div class="glow g2"></div>
<div class="stack">
  <img class="lockup" src="lockup.png" alt="">
  <div class="tag">Websites, social and leads for local insurance agents<b>.</b></div>
  <img class="brand" src="brandline.png" alt="">
</div>
</div></body></html>
