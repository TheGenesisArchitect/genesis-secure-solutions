<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Genovus Intelliware Facebook cover, 1640x624 (2x the 820x312 desktop display). Phones show about the centre
   1120px, so everything sits inside x 260-1380. The G mark and wordmark are cropped from the Genovus logo file
   (lockup-mark.png: lockup.png with its old "Turnkey Agency Platform" line removed); INTELLIWARE and the tagline
   are set in type, in the slot and tracking the old line used. */
*{box-sizing:border-box;margin:0}
html,body{width:1640px;height:624px;overflow:hidden;background:#0b0c10}
.c{position:relative;width:1640px;height:624px;background:radial-gradient(60% 120% at 50% 40%,#13151b 0%,#0b0c10 70%);overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.28}
.g1{width:520px;height:520px;left:-220px;top:220px;background:radial-gradient(circle,#ff5a20 0%,transparent 70%)}
.g2{width:460px;height:460px;right:-200px;top:-200px;background:radial-gradient(circle,#ff9a2a 0%,transparent 70%)}
.stack{position:absolute;left:260px;width:1120px;top:0;height:624px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lock{position:relative;width:1000px}
.lockup{width:1000px;height:auto;display:block;mix-blend-mode:lighten}
.sub{position:absolute;left:26.5%;top:69.2%;font:500 21px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.62em;color:#ff8a3c}
.tag{margin-top:34px;font:500 31px/1.3 Inter,Arial,sans-serif;color:#c7cad1;letter-spacing:-.2px}
.tag b{color:#ff7a32;font-weight:500}
.brand{margin-top:42px;width:700px;height:auto;display:block;mix-blend-mode:lighten}
</style></head>
<body><div class="c">
<div class="glow g1"></div><div class="glow g2"></div>
<div class="stack">
  <div class="lock"><img class="lockup" src="lockup-mark.png" alt=""><div class="sub">INTELLIWARE</div></div>
  <div class="tag">Intelligent software that helps insurance agencies grow<b>.</b></div>
  <img class="brand" src="brandline.png" alt="">
</div>
</div></body></html>
