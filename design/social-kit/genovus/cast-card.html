<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* "Introducing the Cast of Genovus" Facebook Highlights cards, 1080x1920 (9:16 story size).
   ?c=intro | marcus | tasha | julian. Portraits come from public/studio/cast (Cast V2 canon).
   Facebook crops highlight tiles toward the centre, so the name and role sit in the middle band. */
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0c10;color:#f4f5f7;font-family:Inter,Arial,sans-serif}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(80% 60% at 50% 35%,#15171d 0%,#0b0c10 70%)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.30}
.g1{width:900px;height:900px;left:-420px;bottom:-300px;background:radial-gradient(circle,#ff5a20 0%,transparent 70%)}
.g2{width:760px;height:760px;right:-360px;top:-260px;background:radial-gradient(circle,#ffa31a 0%,transparent 70%)}
.top{position:absolute;top:84px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px}
.top img{height:62px}
.top span{font:500 26px/1 'JetBrains Mono',monospace;letter-spacing:.42em;color:#c7cad1}
.kicker{font:500 30px/1 'JetBrains Mono',monospace;letter-spacing:.38em;color:#ff8a3c;text-transform:uppercase}
.foot{position:absolute;bottom:92px;left:0;right:0;text-align:center;font:500 22px/1 'JetBrains Mono',monospace;letter-spacing:.34em;color:#7d828c}
.foot b{color:#ff7a32;font-weight:500}
/* person cards */
.photo{position:absolute;left:0;right:0;top:170px;height:1100px;background-size:cover;background-position:center 20%}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,16,.55) 0%,rgba(11,12,16,0) 16%,rgba(11,12,16,0) 55%,#0b0c10 98%)}
.frame{position:absolute;left:0;right:0;top:170px;height:1100px;border-top:4px solid #ff6a2b}
.info{position:absolute;left:84px;right:84px;top:1150px}
.name{font:900 168px/.95 Inter,Arial,sans-serif;letter-spacing:-6px;margin:22px 0 26px}
.name i{font-style:normal;color:#ff6a2b}
.role{font:800 46px/1.15 Inter,Arial,sans-serif;color:#f4f5f7}
.arch{margin-top:14px;font:500 34px/1.3 Inter,Arial,sans-serif;color:#c7cad1}
.hobby{margin-top:44px;display:inline-flex;align-items:center;gap:16px;padding:18px 30px;border:2px solid rgba(255,138,60,.55);border-radius:999px;font:500 28px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:#ffb27a;text-transform:uppercase}
.hobby::before{content:"";width:14px;height:14px;border-radius:50%;background:#ff6a2b;box-shadow:0 0 18px #ff6a2b}
/* intro card */
.ens{position:absolute;left:0;right:0;top:200px;height:820px;display:flex;gap:6px;background:#ff6a2b}
.ens div{flex:1;background-size:auto 112%;background-position:center 18%;background-repeat:no-repeat;background-color:#3a3c42}
.ens::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b0c10 0%,rgba(11,12,16,0) 12%,rgba(11,12,16,0) 62%,#0b0c10 100%)}
.intro{position:absolute;left:84px;right:84px;top:1010px;text-align:center}
.big{font:900 150px/.92 Inter,Arial,sans-serif;letter-spacing:-5px;margin-top:34px}
.big .o{color:#ff6a2b}
.lede{margin:48px auto 0;max-width:820px;font:500 36px/1.35 Inter,Arial,sans-serif;color:#c7cad1}
.names{margin-top:56px;display:flex;justify-content:center;gap:22px;font:500 26px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#ffb27a}
.names span+span::before{content:"·";margin-right:22px;color:#5b606a}
</style></head>
<body><div class="c" id="c"></div>
<script>
const CAST = {
  marcus:{name:'Marcus',role:'Growth & Partnerships',arch:'The Connector. Finds the agencies ready to grow and gets them moving.',hobby:'Off the clock: barbecue',img:'marcus.jpg'},
  tasha:{name:'Tasha',role:'Agency Success',arch:'The People Reader. Hears what your office needs before you finish the sentence.',hobby:'Off the clock: dance',img:'tasha.jpg'},
  julian:{name:'Julian',role:'Strategy & Product',arch:'The Operator. One real problem, one clear plan, one result.',hobby:'Off the clock: trivia & music',img:'julian.jpg'},
};
const k = new URLSearchParams(location.search).get('c') || 'intro';
const head = `<div class="glow g1"></div><div class="glow g2"></div>
  <div class="top"><img src="../../../public/brand/genovus/genovus-egg.svg" alt=""><span>GENOVUS</span></div>`;
const foot = `<div class="foot">GENOVUS <b>·</b> INTELLIWARE FOR INSURANCE AGENCIES</div>`;
let html;
if (k === 'intro') {
  html = head + `<div class="ens">${['marcus','tasha','julian'].map((n) => `<div style="background-image:url(../../../public/studio/cast/${n}.jpg)"></div>`).join('')}</div>
  <div class="intro"><div class="kicker">Introducing</div>
    <div class="big">The Cast<br>of Genov<span class="o">u</span>s</div>
    <div class="lede">Meet the team behind the series.<br>Every episode: one agency, one real problem, one result.</div>
    <div class="names"><span>MARCUS</span><span>TASHA</span><span>JULIAN</span></div>
  </div>` + foot;
} else {
  const p = CAST[k];
  html = head + `<div class="photo" style="background-image:url(../../../public/studio/cast/${p.img})"></div><div class="frame"></div>
  <div class="info"><div class="kicker">The Cast of Genovus</div>
    <div class="name">${p.name}<i>.</i></div>
    <div class="role">${p.role}</div>
    <div class="arch">${p.arch}</div>
    <div class="hobby">${p.hobby}</div>
  </div>` + foot;
}
document.getElementById('c').innerHTML = html;
</script>
</body></html>
