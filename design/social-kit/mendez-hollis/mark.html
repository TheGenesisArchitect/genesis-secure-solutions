<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
/* Square brand mark for profile pictures and the Google listing logo. Facebook and Instagram crop it to a circle,
   so the mark stays inside the centre 70%. Same JA monogram and lime rule as the site favicon. */
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden}
.m{width:1080px;height:1080px;background:radial-gradient(90% 90% at 50% 30%,#0d2c63 0%,#071d43 70%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ja{font:800 380px/0.9 Manrope,Arial,sans-serif;color:#fff;letter-spacing:-18px;margin-right:18px}
.bar{width:300px;height:26px;border-radius:13px;background:#acd137;margin:44px 0 46px}
.word{font:700 58px/1 'DM Sans',Arial,sans-serif;letter-spacing:14px;color:#d4e6ff;margin-right:-14px}
</style></head>
<body><div class="m"><div class="ja">JA</div><div class="bar"></div><div class="word">JAVA AGENCY</div></div></body></html>
