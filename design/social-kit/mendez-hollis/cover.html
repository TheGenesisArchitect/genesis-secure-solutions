<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Facebook Page cover, 1640x624 (2x of the 820x312 desktop display). Phones show roughly the centre 1120px,
   so every word sits inside that band. Brand values copied from the JAVA Agency landing page. */
:root{--navy:#071d43;--blue:#075cf3;--lime:#acd137;--sky:#d4e6ff}
*{box-sizing:border-box;margin:0}
html,body{width:1640px;height:624px;overflow:hidden;background:var(--navy)}
.c{position:relative;width:1640px;height:624px;background:radial-gradient(120% 140% at 50% 0%,#0d2c63 0%,#071d43 55%,#05152f 100%);font-family:'DM Sans',Arial,sans-serif;color:#fff}
svg.river{position:absolute;inset:0}
.safe{position:absolute;left:260px;width:1120px;top:0;height:624px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
.eyebrow{font:700 22px/1 'DM Sans';letter-spacing:6px;color:var(--sky);margin-bottom:30px}
h1{font:800 92px/1.04 Manrope,Arial,sans-serif;letter-spacing:-3.4px}
h1 span{display:block}
.bar{width:120px;height:8px;background:var(--lime);border-radius:4px;margin:34px 0 30px}
.who{font:600 30px/1.3 'DM Sans';color:#e6ebf4;letter-spacing:-.2px}
.who b{font-weight:700;color:#fff}
.where{margin-top:14px;font:500 24px/1.3 'DM Sans';color:#b7c9e1;display:flex;gap:18px;align-items:center}
.chip{border:2px solid #bddc63;color:#d9ec9c;border-radius:999px;padding:5px 16px;font:700 20px/1.2 'DM Sans';letter-spacing:.3px}
</style></head>
<body><div class="c">
<svg class="river" viewBox="0 0 1640 624" aria-hidden="true">
  <g fill="none" stroke-linecap="round">
    <path d="M-40 520 C 160 430, 300 610, 520 520" stroke="#075cf3" stroke-opacity=".55" stroke-width="3"/>
    <path d="M-40 560 C 170 470, 310 650, 540 560" stroke="#075cf3" stroke-opacity=".3" stroke-width="3"/>
    <path d="M-40 480 C 150 390, 290 570, 500 480" stroke="#acd137" stroke-opacity=".45" stroke-width="3"/>
    <path d="M1100 120 C 1320 30, 1460 210, 1700 110" stroke="#075cf3" stroke-opacity=".55" stroke-width="3"/>
    <path d="M1100 160 C 1330 70, 1470 250, 1700 150" stroke="#075cf3" stroke-opacity=".3" stroke-width="3"/>
    <path d="M1100 80 C 1310 -10, 1450 170, 1700 70" stroke="#acd137" stroke-opacity=".45" stroke-width="3"/>
  </g>
</svg>
<div class="safe">
  <div class="eyebrow">YOUR COMMUNITY. YOUR LOCAL OFFICE.</div>
  <h1><span>Local insurance help.</span><span>Right here at home.</span></h1>
  <div class="bar"></div>
  <div class="who"><b>JAVA Agency</b> &nbsp;·&nbsp; Mendez Hollis &nbsp;·&nbsp; The Columbus Local Office</div>
  <div class="where">Columbus, GA &amp; Phenix City, AL <span class="chip">Hablamos Español</span></div>
</div>
</div></body></html>
